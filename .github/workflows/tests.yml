name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install numpy pillow
      - name: Measurement tests (simulated camera)
        run: python tests/test_beamlab.py
      - name: UI tests (real window, simulated frames)
        run: python tests/test_ui.py
